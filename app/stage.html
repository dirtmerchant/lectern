<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lectern stage</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Stage view for recording a demo: the projector and a live attendee phone
     side by side, in one window. Opened by ./present.sh --stage. */
  html, body { margin: 0; height: 100%; background: #07090c; color: #e8e6e1; font-family: 'IBM Plex Sans', Arial, sans-serif; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr auto; gap: 2.4vw; padding: 3.2vh 2.4vw 3.2vh; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 1.2vh; min-width: 0; height: 100%; justify-content: center; }
  .label { font-family: 'JetBrains Mono', monospace; font-size: max(12px, 1.5vh); letter-spacing: .2em; text-transform: uppercase; color: #8a949e; }
  .label b { color: #e8833a; font-weight: 700; }
  .projector { width: 100%; aspect-ratio: 16 / 9; max-height: 82vh; border: 0; border-radius: 10px; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .phone { height: 86vh; aspect-ratio: 390 / 844; border-radius: 4.6vh; background: #000; padding: 1.4vh; box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 0 2px #2a313a; position: relative; }
  .phone-screen { width: 390px; height: 844px; border: 0; border-radius: 3.4vh; transform-origin: 0 0; background: #0b0e12; display: block; }
  .phone-clip { width: 100%; height: 100%; overflow: hidden; border-radius: 3.4vh; }
  .note { font-size: max(11px, 1.4vh); color: #8a949e; }
</style>
</head>
<body>
<div class="stage">
  <div class="col">
    <div class="label"><b>●</b> Projector</div>
    <iframe class="projector" id="projector" title="Projector" src="index.html?view=audience" allow="camera; microphone; autoplay"></iframe>
    <div class="note" id="note"></div>
  </div>
  <div class="col">
    <div class="label"><b>●</b> An attendee's phone</div>
    <div class="phone" id="phone"><div class="phone-clip"><iframe class="phone-screen" id="phone-screen" title="Attendee phone"></iframe></div></div>
  </div>
</div>
<script>
(async () => {
  const deck = await (await fetch('/api/deck', { cache: 'no-store' })).json();
  const screen = document.getElementById('phone-screen');
  if (deck.follow && deck.follow.url) {
    // Load the phone page the same way a real phone does: over the network address.
    screen.src = deck.follow.url;
    document.getElementById('note').textContent = `Phones join at ${deck.follow.url.replace(/^https?:\/\//, '').replace(/\/$/, '')}`;
  }
  // Scale the 390×844 phone page to fit the phone frame.
  function fitPhone() {
    const clip = screen.parentElement;
    const s = clip.clientWidth / 390;
    screen.style.transform = `scale(${s})`;
  }
  addEventListener('resize', fitPhone);
  fitPhone();
  // Keys pressed here go to the presenter, so the stage window can drive the talk too.
  addEventListener('keydown', (e) => {
    const f = document.getElementById('projector');
    if (f.contentWindow) f.contentWindow.dispatchEvent(new KeyboardEvent('keydown', { key: e.key }));
  });
})();
</script>
</body>
</html>
